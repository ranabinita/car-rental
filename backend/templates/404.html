<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | CarRental</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8f8f8;color:#222}
    .error-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}
    .error-content{max-width:600px}
    .error-code{font-size:140px;font-weight:700;line-height:1;color:#d71920;margin:0}
    .error-content h1{font-size:32px;margin:18px 0 12px}
    .error-content p{font-size:16px;line-height:1.7;color:#666;margin:0 auto 30px}
    .home-btn{display:inline-flex;align-items:center;gap:8px;padding:13px 25px;background:#d71920;color:#fff;text-decoration:none;border-radius:5px;font-weight:600;transition:.2s}
    .home-btn:hover{background:#b9151b}
    @media(max-width:576px){
      .error-code{font-size:95px}
      .error-content h1{font-size:26px}
    }
  </style>
</head>
<body>

<main class="error-page">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1>Oops! Page Not Found</h1>
    <p>The page you're looking for may have been moved, deleted, or doesn't exist.</p>
    <a href="/" class="home-btn">← Back to Home</a>
  </div>
</main>

</body>
</html>
