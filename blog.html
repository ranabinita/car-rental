<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | CarRental</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
  <!-- <link rel="stylesheet" href="css/auth.css"> -->
</head>

<body data-page="blog">

<div id="navbar"></div>

<main>
  <!-- BLOG HERO -->
  <section class="blog-hero">
    <div class="blog-hero-overlay"></div>
    <div class="container blog-hero-content">
      <span>TRAVEL & RENTAL STORIES</span>
      <h1>Car Rental Blog</h1>
      <p>Helpful guides, road trip ideas and useful information for travelling and renting vehicles across Nepal.</p>
    </div>
  </section>

  <!-- BLOG CONTENT -->
  <section class="blog-section">
    <div class="container">
      <div class="blog-layout">

        <!-- LEFT BLOG AREA -->
        <div class="blog-main">
          <div class="blog-grid" id="blogGrid">
            <div class="text-center py-5 w-100">
              <div class="spinner-border" role="status"></div>
              <p class="mt-2">Loading blogs...</p>
            </div>
          </div>
        </div>

        <!-- SIDEBAR -->
        <aside class="blog-sidebar">
          <div class="sidebar-box">
            <h4>Recent Posts</h4>
            <div id="recentPosts">
              <p>Loading recent posts...</p>
            </div>
          </div>

          <div class="sidebar-box">
            <h4>Categories</h4>
            <div class="blog-categories" id="blogCategories">
              <p>Loading categories...</p>
            </div>
          </div>
        </aside>

      </div>
    </div>
  </section>
</main>

<div id="footer"></div>
<!-- <div id="signin-modal-container"></div> -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
