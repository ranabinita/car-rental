<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | CarRental</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body data-page="blog">

<div id="navbar"></div>

<main>
  <section class="blog-hero">
    <div class="blog-hero-overlay"></div>
    <div class="container blog-hero-content">
      <span>TRAVEL & RENTAL STORIES</span>
      <h1 id="blogDetailTitle">Blog Article</h1>
      <p id="blogDetailExcerpt">Loading article...</p>
    </div>
  </section>

  <section class="blog-section">
    <div class="container">
      <div id="blogDetail" class="blog-detail-content">
        <div class="text-center py-5">
          <div class="spinner-border" role="status"></div>
          <p class="mt-2">Loading article...</p>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer"></div>
<div id="signin-modal-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
